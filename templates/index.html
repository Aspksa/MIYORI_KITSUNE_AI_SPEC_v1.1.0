<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miyori Kitsune AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">狐</div>
        <div>
          <h1>Миёри</h1>
          <p>Miyori Kitsune AI</p>
        </div>
      </div>

      <div class="panel">
        <span class="eyebrow">Проект</span>
        <div class="project-row">
          <select id="projectSelect" aria-label="Выбор проекта"></select>
          <button id="addProject" class="icon-button" type="button" title="Создать проект">+</button>
        </div>
      </div>

      <div class="panel conversations-panel">
        <div class="panel-header">
          <span class="eyebrow">Разговоры</span>
          <button id="newChatSide" class="text-button" type="button">Новый</button>
        </div>
        <div id="conversationList" class="conversation-list"></div>
      </div>

      <div class="panel">
        <span class="eyebrow">Состояние</span>
        <div class="status-line">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Проверяю…</span>
        </div>
        <div id="modelText" class="muted">Модель не выбрана</div>
      </div>

      <div class="panel compact">
        <span class="eyebrow">Версия</span>
        <strong id="versionText">00.00.02</strong>
      </div>

      <div class="sidebar-note">
        Проекты изолируют историю диалогов. Контекст выбранного проекта не смешивается с другими проектами.
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <span class="eyebrow" id="projectLabel">Личная AI-помощница</span>
          <h2 id="conversationTitle">Разговор с Миёри</h2>
        </div>
        <button id="newChat" class="secondary" type="button">Новый разговор</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" maxlength="20000" placeholder="Напишите Миёри…" required></textarea>
          <button id="sendButton" type="submit">Отправить</button>
        </form>
        <div id="errorBox" class="error" hidden></div>
      </footer>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
