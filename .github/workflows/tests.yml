name: Miyori Tests

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit and integration tests
        env:
          CLOUDRU_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend toolchain
        run: npm install --package-lock=false --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck:nexus

      - name: Build NEXUS frontend
        run: npm run build:nexus

      - name: Accessibility contract
        run: npm run check:nexus-a11y

      - name: NEXUS state store contract
        run: npm run test:nexus-state

      - name: NEXUS shell contract
        run: npm run test:nexus-shell

      - name: NEXUS Knowledge contract
        run: npm run test:nexus-knowledge

      - name: NEXUS Generative UI contract
        run: npm run test:nexus-surfaces

      - name: NEXUS Living Presence contract
        run: npm run test:nexus-presence

      - name: NEXUS Proactive Miyori contract
        run: npm run test:nexus-proactive

      - name: NEXUS Voice contract
        run: npm run test:nexus-voice

      - name: NEXUS Agent Workspace contract
        run: npm run test:agent-workspace

      - name: NEXUS Home contract
        run: npm run test:nexus-home

      - name: NEXUS Digital Body contract
        run: npm run test:nexus-body

      - name: NEXUS Appearance Profile contract
        run: npm run test:nexus-appearance

      - name: NEXUS Body Renderer Registry contract
        run: npm run test:nexus-body-renderer

      - name: Unified UI contract
        run: npm run test:ui-unification

      - name: Chat experience and sanitized Markdown
        run: npm run test:chat-experience

      - name: Chat capability integration
        run: npm run test:chat-capabilities

      - name: Safe chat forks and retries
        run: npm run test:chat-safe-forks

      - name: Chat Intelligence UI contract
        run: npm run test:chat-intelligence

      - name: Document comparison contract
        run: npm run test:document-comparisons

      - name: Validate JavaScript syntax
        run: |
          for file in static/js/*.js; do node --check "$file"; done
          for file in static/js/nexus/*.js; do node --check "$file"; done

      - name: Verify committed NEXUS build
        run: git diff --exit-code -- static/js/nexus

  portable_zip:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ZIP-like portable folder
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "miyori-portable.zip"
          $root = Join-Path $env:RUNNER_TEMP "miyori-portable"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          git archive --format=zip --output=$zip HEAD
          Expand-Archive -Path $zip -DestinationPath $root -Force
          "PORTABLE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify ZIP startup through Miyori.bat
        shell: cmd
        run: |
          cd /d "%PORTABLE_ROOT%"
          call Miyori.bat --check

