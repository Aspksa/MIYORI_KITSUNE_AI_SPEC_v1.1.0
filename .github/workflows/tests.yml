name: Miyori Tests

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit and integration tests
        env:
          CLOUDRU_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend toolchain
        run: npm install --package-lock=false --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck:nexus

      - name: Build NEXUS frontend
        run: npm run build:nexus

      - name: Accessibility contract
        run: npm run check:nexus-a11y

      - name: NEXUS state store contract
        run: npm run test:nexus-state

      - name: Validate JavaScript syntax
        run: |
          for file in static/js/*.js; do node --check "$file"; done
          for file in static/js/nexus/*.js; do node --check "$file"; done

      - name: Verify committed NEXUS build
        run: git diff --exit-code -- static/js/nexus

